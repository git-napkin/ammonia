name: Build Check

on:
  push:
    branches: [master, backup]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Ensure scripts are executable
        run: chmod +x setup_frida.sh install.sh installer/scripts/postinstall
      - name: Download + build Frida-Gum
        run: ./setup_frida.sh
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: |
          cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release -DBUILD_CONFIGURATOR=OFF
          cmake --build Build -j8
      - name: Verify artifacts
        run: |
          test -f Build/libfangs_hook.dylib
          test -f Build/libplayground_opener.dylib
          test -f Build/grant
      - name: Unit tests
        run: ctest --test-dir Build --output-on-failure
